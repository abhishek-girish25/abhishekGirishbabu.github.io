<html lang="en">

<title>Abhishek Girishbabu | Digital Marketing Portfolio</title>

<style>
:root {
    --bg: #f4f6f8;
    --text: #1f2937;
    --card: #ffffff;
    --primary: #2563eb;
}

body.dark {
    --bg: #0f172a;
    --text: #e5e7eb;
    --card: #1e293b;
}

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: 0.3s;
}

/* NAVBAR */
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 40px;
    background: var(--card);
    position: sticky;
    top: 0;
    z-index: 100;
}

nav a {
    margin-left: 20px;
    text-decoration: none;
    color: var(--text);
    font-weight: 600;
}

/* DARK MODE */
.toggle {
    cursor: pointer;
    background: var(--primary);
    color: white;
    padding: 6px 14px;
    border-radius: 20px;
}

/* HERO */
.hero {
    text-align: center;
    padding: 80px 20px;
}

.profile-img {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid var(--primary);
    margin-bottom: 20px;
}

.hero h1 {
    font-size: 38px;
}

.hero p {
    font-size: 18px;
    opacity: 0.85;
}

/* SECTIONS */
section {
    max-width: 1100px;
    margin: auto;
    padding: 60px 20px;
}

h2 {
    color: var(--primary);
    margin-bottom: 25px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
}

.card {
    background: var(--card);
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.12);
}

/* CONTACT */
.contact a {
    display: block;
    margin-bottom: 10px;
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
}

/* STICKY BUTTON */
.sticky {
    position: fixed;
    bottom: 25px;
    right: 25px;
    background: var(--primary);
    color: white;
